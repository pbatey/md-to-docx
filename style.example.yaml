inline_code:
  font: Consolas
  size_pt: 10
  color: null
  fill: null
code_block:
  font: Consolas
  size_pt: 9
  fill: F2F2F2
  padding_pt: 6
  space_before_pt: 8
  space_after_pt: 8
  indent_in: 0.25
  caption:
    size_pt: 8
    color: '808080'
    italic: true
blockquote:
  bar_color: 365F91
  bar_width_pt: 2.25
  bar_gap_pt: 12
  indent_in: 0.25
  space_after_pt: 4
lists:
  bullet:
    glyphs:
    - ∩é╖
    - ∩é╖
    glyph_fonts:
    - Symbol
    - Symbol
    indent_in:
    - 0.5
    - 0.75
    space_after_pt: 2
  ordered:
    indent_in: 0.5
    space_after_pt: 2
    restart_each_block: true
table:
  border:
    style: single
    width_pt: 0.75
    color: '808080'
    edges:
    - insideH
  header:
    bold: true
    fill: null
    underline_width_pt: 1.0
    underline_color: '404040'
  cell_margins_pt:
    top: 4
    bottom: 4
    left: 5
    right: 10
  width: full
  indent_in: 0.25
hr:
  space_after_pt: 6
  rule: true
  width_pt: 0.75
  color: BFBFBF
links:
  color: 0563C1
  underline: true

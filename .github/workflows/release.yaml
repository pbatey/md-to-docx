name: Release

# Triggered when you publish a GitHub Release (including publishing a draft).
# Draft releases do NOT trigger this workflow — only clicking "Publish release" does.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # update the GitHub Release body with the changelog notes
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Verify release tag matches pyproject.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(uv version --short)"
          echo "Release tag version:   $TAG"
          echo "pyproject.toml version: $PROJECT_VERSION"
          if [ "$TAG" != "$PROJECT_VERSION" ]; then
            echo "::error::Release tag ($TAG) does not match pyproject.toml version ($PROJECT_VERSION)."
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Print the body under "## [<version>]" up to (not including) the next
          # "## " heading, trimming leading/trailing blank lines.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md | sed -e '/./,$!d' | tac | sed -e '/./,$!d' | tac > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for version $VERSION (expected a '## [$VERSION]' heading with content)."
            exit 1
          fi
          echo "----- release notes -----"
          cat release-notes.md

      - name: Update the GitHub Release body with the changelog notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --notes-file release-notes.md --repo "${GITHUB_REPOSITORY}"

      - name: Build sdist and wheel
        run: uv build --no-sources

      - name: Upload distributions as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The Trusted Publisher on PyPI must be configured to allow this environment.
    environment: pypi
    permissions:
      contents: write   # attach built artifacts to the GitHub Release
      id-token: write   # OIDC token for PyPI Trusted Publishing
    steps:
      - name: Download distributions artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Attach distributions to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false

      - name: Publish to PyPI (Trusted Publishing)
        run: uv publish

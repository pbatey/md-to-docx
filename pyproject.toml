[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "md-to-docx"
version = "0.2.0"
description = "Convert Markdown to DOCX with YAML-configurable styling, preserving line breaks, tables, lists, and internal links."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Phil Batey" }]
keywords = ["markdown", "docx", "word", "converter", "python-docx"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Office/Business",
]
dependencies = ["python-docx", "pyyaml"]

[project.scripts]
md-to-docx = "md_to_docx:main"

[project.urls]
Homepage = "https://github.com/pbatey/md-to-docx"
Source = "https://github.com/pbatey/md-to-docx"

[dependency-groups]
dev = ["pytest>=8"]

# TestPyPI target for dry-run publishing (see .github/workflows/release-testpypi.yaml).
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/md_to_docx"]

[tool.hatch.build.targets.sdist]
include = [
    "src/md_to_docx",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# A focused, high-value rule set rather than ruff's full defaults.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (unused imports/names, etc.)
    "I",    # isort (import ordering)
    "UP",   # pyupgrade (modern syntax)
    "B",    # flake8-bugbear (likely bugs)
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie (misc lints)
    "FURB", # refurb (modernizations)
]
ignore = [
    # Line length has never been enforced in this project; many descriptive
    # lines and OOXML literals run long by design. Not worth mass-reflowing.
    "E501",
    # This converter is deliberately fail-soft: rendering a document should
    # never crash on one malformed element, so broad try/except that swallow
    # or continue are intentional throughout.
    "BLE001", # blind `except Exception`
    "S110",   # try-except-pass
    "S112",   # try-except-continue
    # The code favours explicit int(round(...)) casts for OOXML sizing; the
    # "already an integer" hint fights that intentional clarity.
    "RUF046",
    # The module is untyped by design; implicit Optional from `x=None` params
    # is fine here and adding annotations is out of scope.
    "RUF013",
]
